[package]
name = "verify-project"
version = "0.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
regex = "1"
anyhow = "1"
thiserror = "1"
itertools = "0.13"

[[bin]]
name = "_placeholder"
path = "src/main.rs"

[workspace]
