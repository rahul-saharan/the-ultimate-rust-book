[package]
name = "verify-project"
version = "0.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
regex = "1"
anyhow = "1"
thiserror = "1"
itertools = "0.13"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http-body-util = "0.1"
rayon = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "_placeholder"
path = "src/main.rs"

[workspace]
